<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;background:#f3f1ff;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2430">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f1ff;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:18px;overflow:hidden">
        <tr><td style="background:linear-gradient(135deg,#6d28d9,#db2777);background-color:#6d28d9;padding:16px 24px;color:#fff;font-weight:800;font-size:18px">NeuLearning</td></tr>
        <tr><td style="padding:24px;font-size:16px;line-height:1.5">
          {% block body %}{% endblock %}
        </td></tr>
        <tr><td style="padding:16px 24px;border-top:1px solid #eee;font-size:12px;color:#6b7280">
          You're getting this because {{ what }} are on for your NeuLearning account.
          <a href="{{ unsubscribe_url }}" style="color:#6b7280">Turn these emails off</a>.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body></html>
