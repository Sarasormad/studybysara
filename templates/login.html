{% extends "base.html" %}
{% block title %}Log in · TutorConnect{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="sub">Log in as a student or tutor.</p>

<form method="post" action="{{ url_for('login') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label>Email
    <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
  </label>
  <label>Password
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button type="submit">Log in</button>
</form>

<p class="switch">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
{% endblock %}
