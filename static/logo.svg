<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="NeuLearning">
  <!-- NeuLearning mark: a brain whose two halves hold math (+ and ×). -->
  <defs>
    <linearGradient id="nl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#nl-bg)"/>
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- left half -->
    <path d="M20 10.5c-2.4-2.6-7-2-8 1.6-3 .3-4.6 3.4-3.3 5.9-2.1 1.6-2 4.8.1 6.2-.6 3.1 2.2 5.6 5.2 4.8 1.3 2.4 4.4 2.6 6 .9"/>
    <!-- right half -->
    <path d="M20 10.5c2.4-2.6 7-2 8 1.6 3 .3 4.6 3.4 3.3 5.9 2.1 1.6 2 4.8-.1 6.2.6 3.1-2.2 5.6-5.2 4.8-1.3 2.4-4.4 2.6-6 .9"/>
    <!-- the fold down the middle -->
    <path d="M20 10.5v19.4"/>
  </g>
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M11.8 19.6h4.8M14.2 17.2v4.8" stroke="#fde047"/>   <!-- + -->
    <path d="M23.6 17.4l4.4 4.4M28 17.4l-4.4 4.4" stroke="#5eead4"/>   <!-- × -->
  </g>
</svg>
